<!DOCTYPE html>
<html>
<head>
  <title>Zona Kompetensi Ilham</title>

  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #f5f5f5;
      transition: 0.4s ease;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .fade-in {
      animation: fadeSlide 0.5s ease;
    }

    .header {
      background: white;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .navbar {
      background: #2c2c2c;
      padding: 12px;
      overflow-x: auto;
      white-space: nowrap;
    }

    .navbar a {
      margin-right: 15px;
      cursor: pointer;
      color: #ccc;
      text-decoration: none;
      transition: 0.3s;
    }

    .navbar a.active {
      color: #ff5252;
      font-weight: bold;
    }

    .container {
      width: 85%;
      margin: 20px auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
    }

    .foto {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid white;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: 0.3s;
    }

    .foto:hover {
      transform: scale(1.08);
      box-shadow: 0 0 20px rgba(211,47,47,0.6);
      border-color: #d32f2f;
    }

    .cv-header {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .cv-section {
      margin-top: 20px;
    }

    .cv-section h3 {
      color: red;
    }

    .item {
      display: flex;
      border-top: 1px solid #ddd;
      padding: 10px 0;
    }

    .label {
      width: 120px;
      font-weight: bold;
      color: red;
    }

    .note {
      font-style: italic;
      font-weight: 600;
      color: #444;
    }

    .footer {
      text-align: center;
      font-size: 12px;
      color: #999;
      margin: 20px 0;
    }
  </style>
</head>

<body>

<div class="header">
  <img src="logota.png" height="40">
</div>

<div class="navbar" id="nav"></div>

<div class="container fade-in" id="content"></div>

<p class="footer">© Ilham Wahyudi - 2026</p>

<script>
/* =========================
   1. DATA (CLEAN SEPARATE)
========================= */
const data = {
  cv: {
    warna: "#f5f5f5",
    html: `
      <div class="cv-header">
        <img src="fotoprofil.jpg" class="foto">
        <div>
          <h2>Ilham Wahyudi</h2>
          <p>Teknisi Manage Operation SPBU (2019 - Sekarang)</p>
        </div>
      </div>

      <div class="cv-section">
        <h3>Profil</h3>
        <p>Teknisi jaringan dan operasional dengan pengalaman lebih dari 4 tahun...</p>
      </div>
    `
  },

  digital: {
    warna: "#1565c0",
    judul: "DIGITAL LEADERSHIP",
    desc: "Kemampuan transformasi digital...",
    situation: "Proses masih manual",
    task: "Efisiensi kerja",
    action: "Optimasi sistem dan workflow",
    result: "Lebih cepat"
  },

  global: {
    warna: "#283593",
    judul: "GLOBAL BUSINESS SAVVY",
    desc: "Kemampuan memahami bisnis global...",
    situation: "Persaingan tinggi",
    task: "Naikkan daya saing",
    action: "Analisis pasar global",
    result: "Strategi tepat"
  }
};

/* =========================
   2. NAVIGATION RENDER
========================= */
const navItems = [
  ["cv", "About Me"],
  ["digital", "Digital"],
  ["global", "Global"]
];

const nav = document.getElementById("nav");

navItems.forEach(([key, label]) => {
  const a = document.createElement("a");
  a.textContent = label;
  a.dataset.key = key;

  a.addEventListener("click", () => {
    setActive(a);
    render(key);
  });

  nav.appendChild(a);
});

/* =========================
   3. ACTIVE STATE
========================= */
function setActive(el) {
  document.querySelectorAll(".navbar a")
    .forEach(a => a.classList.remove("active"));
  el.classList.add("active");
}

/* =========================
   4. RENDER ENGINE
========================= */
function render(key) {
  const d = data[key];
  document.body.style.background = d.warna;

  let html = "";

  if (key === "cv") {
    html = d.html;
  } else {
    html = `
      <h2>${d.judul}</h2>
      <p>${d.desc}</p>

      <div class="item"><div class="label">SITUATION</div><div>${d.situation}</div></div>
      <div class="item"><div class="label">TASK</div><div>${d.task}</div></div>
      <div class="item"><div class="label">ACTION</div><div>${d.action}</div></div>
      <div class="item"><div class="label">RESULT</div><div>${d.result}</div></div>
    `;
  }

  const content = document.getElementById("content");
  content.innerHTML = html;
  content.classList.remove("fade-in");
  void content.offsetWidth; // reset anim
  content.classList.add("fade-in");
}

/* =========================
   5. INIT DEFAULT
========================= */
render("cv");
nav.querySelector("a").classList.add("active");
</script>

</body>
</html>
